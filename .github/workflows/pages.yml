name: Deploy public sample to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MORTGAGE_DATA_DIR: ""
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Generate public sample forecast
        run: python scripts/generate_forecast.py --data-dir sample-data

      - name: Verify sample provenance
        run: |
          python -c 'import json; from pathlib import Path; document = json.loads(Path("dashboard/public/generated/forecast.json").read_text()); assert document["data_source"] == {"type": "sample"}'

      - name: Test calculation engine and JSON Schema
        run: python -m pytest

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm ci

      - name: Test dashboard
        working-directory: dashboard
        run: |
          npm test
          npm run test:build-policy
          npm run typecheck
          npm run lint

      - name: Build public sample
        working-directory: dashboard
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dashboard/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
