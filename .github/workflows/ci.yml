name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  public-sample:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MORTGAGE_DATA_DIR: ""
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Generate sample forecast
        run: python scripts/generate_forecast.py
      - name: Python tests and JSON Schema validation
        run: pytest
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - working-directory: dashboard
        run: npm ci
      - working-directory: dashboard
        run: npm test
      - working-directory: dashboard
        run: npm run test:build-policy
      - working-directory: dashboard
        run: npm run typecheck
      - working-directory: dashboard
        run: npm run lint
      - working-directory: dashboard
        run: npm run build
