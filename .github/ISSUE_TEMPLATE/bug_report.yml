name: Bug report
description: Report a problem using artificial sample data only.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Do not attach bank statements, account numbers, addresses, contracts,
        screenshots, PDFs, or private forecast.json files.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I replaced all personal financial data with artificial sample data.
          required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Explain the problem and provide an artificial reproduction.
    validations:
      required: true
