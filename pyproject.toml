[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mortgage-forecast"
version = "0.1.0"
description = "Golden-test-first mortgage repayment simulator"
requires-python = ">=3.13"

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "private_actual: tests that require MORTGAGE_DATA_DIR with private bank schedules",
]

[tool.setuptools.packages.find]
include = ["mortgage*"]
